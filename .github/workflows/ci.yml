name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Run all checks and Windows/Linux packages, or request one desktop build
        type: choice
        default: all
        options: [all, linux-desktop, windows-desktop, macos-desktop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12.10", "3.13.15"]
        qt: ["6.9.0", "6.11.2"]
        include:
          # 3.12.14 has no Win/mac binaries in actions/python-versions.
          - os: ubuntu-latest
            python: "3.12.14"
            qt: "6.9.0"
          - os: ubuntu-latest
            python: "3.12.14"
            qt: "6.11.2"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Material
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install constrained tools and selected GUI boundary
        run: python -m pip install -c constraints/quality.txt -e ".[dev]" PySide6==${{ matrix.qt }}
      - run: python -m pip check
      - run: ruff format --check netconfiglint tests benchmarks scripts experiments
      - run: ruff check netconfiglint tests benchmarks scripts experiments
      # Qt 6.9 stubs omit valid Property decorator / invokeMethod overloads.
      # Runtime tests still cover both Qt boundaries; type-check release stubs.
      - name: Mypy with qualified release Qt stubs
        if: matrix.qt == '6.11.2'
        run: mypy netconfiglint
      - name: Test suite
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13.15' || matrix.qt != '6.11.2'
        # Keep every functional test in the platform matrix. The unchanged
        # wall-clock performance budget runs once in the release environment below.
        run: python -m pytest --ignore=tests/performance
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13.15' && matrix.qt == '6.11.2'
        run: python -m pytest --ignore=tests/performance --cov=netconfiglint --cov-report=term --cov-fail-under=90
      - name: Performance gate outside coverage instrumentation
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13.15' && matrix.qt == '6.11.2'
        run: python -m pytest tests/performance
      - run: python -m netconfiglint.gui.app.main --smoke-test build/offscreen-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: offscreen-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.qt }}
          path: build/offscreen-smoke

  desktop-build:
    name: Actual build and desktop smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'linux-desktop' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-desktop' && '["windows-latest"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'macos-desktop' && '["macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    env:
      PYTHONUTF8: "1"
      QT_QUICK_CONTROLS_STYLE: Material
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install Linux desktop/build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0
      - name: Install qualified build environment
        run: python -m pip install -c constraints/release.txt -e ".[gui]" Nuitka pefile
      - name: Source and reachable history privacy gate
        run: python scripts/audit_release.py --root . --baseline v2.4.0 --output build/source-privacy.json
      - name: Install WiX MSI toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress
      - run: python scripts/check_build_environment.py
      - name: Compile Windows standalone and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_portable.ps1
      - name: Compile Unix standalone
        if: runner.os != 'Windows'
        run: python scripts/build_desktop.py
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_msi.ps1 -SkipAppBuild
      - name: Install and uninstall Windows MSI twice
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows_msi.ps1
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: python scripts/build_linux_deb.py
      - name: Build macOS installer package
        if: runner.os == 'macOS'
        run: python scripts/build_macos_pkg.py
      - name: Fresh Unicode path, native/software smoke and Windows release license gate
        shell: pwsh
        run: |
          $distribution = if ($IsLinux) { Get-Item build/deb/root/opt/netconfiglint } else {
            Get-ChildItem dist -Directory | Where-Object { $_.Extension -in @('.dist', '.app') }
          }
          if (@($distribution).Count -ne 1) { throw 'Expected one distribution' }
          $fresh = Join-Path $PWD 'build/独立 验收/runtime'
          New-Item -ItemType Directory -Force (Split-Path $fresh) | Out-Null
          Copy-Item -LiteralPath $distribution.FullName -Destination $fresh -Recurse
          if ($IsWindows -or $IsLinux) {
            python scripts/assemble_licenses.py $fresh --verify
            if ($LASTEXITCODE -ne 0) { throw 'License gate failed' }
          }
          $entry = if ($IsWindows) { 'NetConfigLint.exe' } elseif ($IsMacOS) {
            $bundleExecutable = /usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$fresh/Contents/Info.plist"
            "Contents/MacOS/$bundleExecutable"
          } else { 'NetConfigLint' }
          $executable = Join-Path $fresh $entry
          if ($IsLinux) {
            foreach ($plugin in (Get-ChildItem $fresh -Recurse -File -Filter libqxcb.so)) {
              $dependencies = & ldd $plugin.FullName
              $dependencies | Write-Output
              if ($dependencies -match 'not found') { throw 'Missing XCB platform dependency' }
            }
          }
          $env:PYTHONPATH = ''
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          foreach ($backend in @('native', 'software')) {
            if ($backend -eq 'software') { $env:QT_QUICK_BACKEND = 'software' }
            else { Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue }
            $output = Join-Path $PWD "build/desktop-$backend"
            if ($IsLinux) { & xvfb-run -a $executable --smoke-test $output }
            elseif ($IsWindows) {
              # PowerShell can return immediately for a GUI-subsystem executable.
              # Wait for the real process exit before reading its result file.
              python -c 'import subprocess, sys; subprocess.run([sys.argv[1], "--smoke-test", sys.argv[2]], check=True, timeout=90)' $executable $output
            }
            else { & $executable --smoke-test $output }
            if ($LASTEXITCODE -ne 0) { throw "Standalone $backend smoke failed" }
            if (-not (Get-Content -Raw "$output/smoke-result.json" | ConvertFrom-Json).passed) { throw 'Smoke rejected' }
          }
      - name: Inspect native installer payload and portable ZIP before upload
        id: payload_privacy
        shell: pwsh
        run: |
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: PySide6_Essentials==6.11.2 -d build/upstream-wheels
          if ($LASTEXITCODE -ne 0) { throw 'Official upstream wheel download failed' }
          $wheels = @(Get-ChildItem build/upstream-wheels -Filter 'pyside6_essentials-6.11.2-*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected one official platform wheel' }
          $wheel = $wheels[0].FullName
          if ($IsWindows) {
            $payload = 'build/msi/source'; $platform = 'windows'; $extension = '*.msi'
            $archives = @(Get-ChildItem release -Filter '*.zip' -File)
            if ($archives.Count -ne 1) { throw 'Expected one portable ZIP' }
            python scripts/audit_release.py --root . --baseline v2.4.0 --archive $archives[0].FullName --upstream-wheel $wheel --output build/portable-privacy.json
            if ($LASTEXITCODE -ne 0) { throw 'Portable privacy gate failed' }
          } elseif ($IsLinux) {
            $payload = 'build/deb/root'; $platform = 'linux'; $extension = '*.deb'
          } else {
            $payload = 'build/macos-pkg/root'; $platform = 'macos'; $extension = '*.pkg'
          }
          $provenanceArguments = @()
          if (-not $IsWindows) {
            python scripts/native_privacy_provenance.py --download $platform --directory build/upstream-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed runtime provenance input gate failed' }
            $pythonArchives = @(Get-ChildItem build/upstream-runtime -File -Filter 'python-3.13.15-*.tar.gz')
            if ($pythonArchives.Count -ne 1) { throw 'Expected one exact reviewed Python runtime archive' }
            $provenanceArguments += @('--upstream-python-archive', $pythonArchives[0].FullName)
            if ($IsLinux) {
              $patchers = @(Get-ChildItem build/upstream-runtime -File -Filter 'patchelf-0.19.1.0-*.whl')
              if ($patchers.Count -ne 1) { throw 'Expected one exact reviewed patcher wheel' }
              $provenanceArguments += @('--reviewed-patcher-wheel', $patchers[0].FullName)
            }
          }
          $installers = @(Get-ChildItem release -Filter $extension -File)
          if ($installers.Count -ne 1) { throw 'Expected one native installer' }
          python scripts/audit_installer_payload.py $payload --root . --platform $platform --installer $installers[0].FullName --upstream-wheel $wheel @provenanceArguments --output build/installer-payload-privacy.json
          if ($LASTEXITCODE -ne 0) { throw 'Native installer payload privacy gate failed' }
      - name: Prepare internal Linux runtime for native desktop qualification
        if: runner.os == 'Linux'
        run: |
          python -c 'import pathlib,tarfile; p=pathlib.Path("build/deb/root/opt/netconfiglint"); assert (p/"SBOM.json").is_file(); t=tarfile.open("build/linux-runtime-qa.tar.gz","w:gz"); t.add(p,arcname="runtime"); t.close()'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() && steps.payload_privacy.outcome == 'success'
        with:
          name: compiled-desktop-${{ matrix.os }}
          path: |
            build/desktop-native
            build/desktop-software
            dist/*.dist/SBOM.json
            build/deb/root/opt/netconfiglint/SBOM.json
            build/macos-pkg/root/Applications/NetConfigLint-SBOM.json
            release/*.zip
            release/*.msi
            release/*.deb
            release/*.pkg
            build/linux-runtime-qa.tar.gz
            build/portable-privacy.json
            build/source-privacy.json
            build/installer-payload-privacy.json
          if-no-files-found: error
          retention-days: 30

  security:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Static and dependency security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install security scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Public source and complete history privacy gate
        run: python scripts/privacy_guard.py --refs HEAD --tags --output build/source-privacy.json
      - name: Bandit medium/high findings gate
        run: python -m bandit -r netconfiglint scripts -q -ll
      - name: Audit pinned quality and release dependencies
        run: |
          python -m pip_audit -r constraints/quality.txt --no-deps
          python -m pip_audit -r constraints/release.txt --no-deps
          python -m pip_audit -r constraints/catalog.txt --no-deps
