name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Run all checks, or retry one desktop build
        type: choice
        default: all
        options: [all, linux-desktop, windows-desktop]

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12.10", "3.13.2"]
        qt: ["6.9.0", "6.11.2"]
        include:
          # 3.12.14 has no Win/mac binaries in actions/python-versions.
          - os: ubuntu-latest
            python: "3.12.14"
            qt: "6.9.0"
          - os: ubuntu-latest
            python: "3.12.14"
            qt: "6.11.2"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Material
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install constrained tools and selected GUI boundary
        run: python -m pip install -c constraints/quality.txt -e ".[dev]" PySide6==${{ matrix.qt }}
      - run: python -m pip check
      - run: ruff format --check netconfiglint tests benchmarks scripts experiments
      - run: ruff check netconfiglint tests benchmarks scripts experiments
      # Qt 6.9 stubs omit valid Property decorator / invokeMethod overloads.
      # Runtime tests still cover both Qt boundaries; type-check release stubs.
      - name: Mypy with qualified release Qt stubs
        if: matrix.qt == '6.11.2'
        run: mypy netconfiglint
      - run: python -m pytest
      - run: python -m netconfiglint.gui.app.main --smoke-test build/offscreen-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offscreen-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.qt }}
          path: build/offscreen-smoke

  desktop-build:
    name: Actual build and desktop smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'linux-desktop' && '["ubuntu-latest"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-desktop' && '["windows-latest"]' || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}
    env:
      PYTHONUTF8: "1"
      QT_QUICK_CONTROLS_STYLE: Material
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
          cache: pip
      - name: Install Linux desktop/build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0
      - name: Install qualified build environment
        run: python -m pip install -c constraints/release.txt -e ".[gui]" Nuitka pefile
      - run: python scripts/check_build_environment.py
      - name: Compile Windows standalone and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_portable.ps1
      - name: Compile Unix standalone
        if: runner.os != 'Windows'
        run: python scripts/build_desktop.py
      - name: Fresh Unicode path, native/software smoke and Windows release license gate
        shell: pwsh
        run: |
          $distribution = Get-ChildItem dist -Directory | Where-Object { $_.Extension -in @('.dist', '.app') }
          if (@($distribution).Count -ne 1) { throw 'Expected one distribution' }
          $fresh = Join-Path $PWD 'build/独立 验收/runtime'
          New-Item -ItemType Directory -Force (Split-Path $fresh) | Out-Null
          Copy-Item -LiteralPath $distribution.FullName -Destination $fresh -Recurse
          if ($IsWindows) {
            python scripts/assemble_licenses.py $fresh --verify
            if ($LASTEXITCODE -ne 0) { throw 'License gate failed' }
          }
          $entry = if ($IsWindows) { 'NetConfigLint.exe' } elseif ($IsMacOS) {
            $bundleExecutable = /usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$fresh/Contents/Info.plist"
            "Contents/MacOS/$bundleExecutable"
          } else { 'NetConfigLint' }
          $executable = Join-Path $fresh $entry
          if ($IsLinux) {
            foreach ($plugin in (Get-ChildItem $fresh -Recurse -File -Filter libqxcb.so)) {
              $dependencies = & ldd $plugin.FullName
              $dependencies | Write-Output
              if ($dependencies -match 'not found') { throw 'Missing XCB platform dependency' }
            }
          }
          $env:PYTHONPATH = ''
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          foreach ($backend in @('native', 'software')) {
            if ($backend -eq 'software') { $env:QT_QUICK_BACKEND = 'software' }
            else { Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue }
            $output = Join-Path $PWD "build/desktop-$backend"
            if ($IsLinux) { & xvfb-run -a $executable --smoke-test $output }
            elseif ($IsWindows) {
              # PowerShell can return immediately for a GUI-subsystem executable.
              # Wait for the real process exit before reading its result file.
              python -c 'import subprocess, sys; subprocess.run([sys.argv[1], "--smoke-test", sys.argv[2]], check=True, timeout=90)' $executable $output
            }
            else { & $executable --smoke-test $output }
            if ($LASTEXITCODE -ne 0) { throw "Standalone $backend smoke failed" }
            if (-not (Get-Content -Raw "$output/smoke-result.json" | ConvertFrom-Json).passed) { throw 'Smoke rejected' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-desktop-${{ matrix.os }}
          path: |
            build/desktop-native
            build/desktop-software
            dist/*.dist/SBOM.json
