name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      QT_QUICK_CONTROLS_STYLE: Material
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.2"
          cache: pip
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0
      - name: Install WiX MSI toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress
      - name: Install qualified build environment
        run: python -m pip install -c constraints/release.txt -e ".[gui]" Nuitka pefile
      - run: python scripts/check_build_environment.py
      - name: Decode Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/netconfiglint-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          }
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          ./scripts/build_windows.ps1
          $pfx = "$env:RUNNER_TEMP/netconfiglint-signing.pfx"
          if (Test-Path -LiteralPath $pfx) {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild -PfxPath $pfx
            ./scripts/build_msi.ps1 -Version $version -SkipAppBuild -PfxPath $pfx
          } else {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild
            ./scripts/build_msi.ps1 -Version $version -SkipAppBuild
          }
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: |
          version="${APP_VERSION#v}"
          python scripts/build_desktop.py
          python scripts/build_linux_deb.py --version "$version"
      - name: Import Apple certificates
        if: runner.os == 'macOS' && env.MACOS_APPLICATION_IDENTITY != ''
        env:
          MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATES_P12_BASE64"
          keychain="$RUNNER_TEMP/netconfiglint.keychain-db"
          echo "$MACOS_CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/netconfiglint.p12"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$RUNNER_TEMP/netconfiglint.p12" -P "$MACOS_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Decode Apple notarization key
        if: runner.os == 'macOS' && env.MACOS_NOTARY_KEY_ID != ''
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          test -n "$MACOS_NOTARY_KEY_BASE64"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/netconfiglint-notary.p8"
          echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/netconfiglint-notary.p8" >> "$GITHUB_ENV"
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: |
          version="${APP_VERSION#v}"
          python scripts/build_desktop.py
          python scripts/build_macos_pkg.py --version "$version"
      - name: Audit source before upload
        run: python scripts/audit_release.py --baseline HEAD^ --output build/release-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/*

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Build checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
