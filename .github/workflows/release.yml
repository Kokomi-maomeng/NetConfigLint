name: Prepare audited release draft

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full CI run whose desktop artifacts passed every gate
        required: true
        type: string
      release_tag:
        description: Existing version tag at exactly the full CI run head commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  draft:
    name: Verify full CI artifacts and prepare draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONUTF8: '1'
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
      - name: Require clean complete public history before any release writes
        run: python scripts/privacy_guard.py --refs HEAD --tags --output build/release-privacy.json
      - name: Verify complete successful CI at the tag commit
        shell: bash
        run: |
          mkdir -p build
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > build/ci-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" > build/ci-jobs.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > build/ci-artifacts.json
          python scripts/audit_release.py --root . --verify-ci-run build/ci-run.json --ci-jobs build/ci-jobs.json --ci-artifacts build/ci-artifacts.json --expected-workflow-id "$workflow_id" --repository "$GITHUB_REPOSITORY" --source-run-id "$SOURCE_RUN_ID" --release-tag "$RELEASE_TAG" --output build/ci-reuse-verification.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: compiled-desktop-*
          merge-multiple: false
          path: build/reused-desktop
      - name: Verify audited packages and collect exact release assets
        shell: bash
        run: |
          python scripts/audit_release.py --root . --artifact-root build/reused-desktop --release-tag "$RELEASE_TAG" --source-run-id "$SOURCE_RUN_ID" --staging-directory release --output build/reused-assets-verification.json
          python scripts/verify_release_identity.py --archive "release/NetConfigLint-${RELEASE_TAG#v}-windows-x64-portable.zip" --tag "$RELEASE_TAG"
          (cd release && sha256sum --check SHA256SUMS.txt)
          # This workflow never changes an already public release back into a draft.
          if gh release view "$RELEASE_TAG" --json isDraft,assets > build/existing-release.json 2> build/release-query-error.txt; then
            python - <<'PY'
          import json
          from pathlib import Path
          existing = json.loads(Path("build/existing-release.json").read_text())
          assert existing["isDraft"] is True, "Refusing to change an already public release"
          verified = {path.name for path in Path("release").iterdir()}
          assert {asset["name"] for asset in existing["assets"]} <= verified, "Existing draft contains unqualified extra assets"
          PY
          elif ! grep -qi 'release not found' build/release-query-error.txt; then
            cat build/release-query-error.txt
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.msi
            release/*.deb
            release/SHA256SUMS.txt
