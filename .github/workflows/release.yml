name: Release Windows portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package and publish
        required: true
        type: string
      source_run_id:
        description: Completed Windows portable release run to reuse its artifact
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  package:
    name: Package / windows-latest
    if: ${{ inputs.source_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      QT_QUICK_CONTROLS_STYLE: Material
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.2"
          cache: pip
      - name: Install qualified build environment
        run: python -m pip install -c constraints/release.txt -e ".[gui]" Nuitka pefile
      - run: python scripts/check_build_environment.py
      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/netconfiglint-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          }
      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          ./scripts/build_windows.ps1
          $pfx = "$env:RUNNER_TEMP/netconfiglint-signing.pfx"
          if (Test-Path -LiteralPath $pfx) {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild -PfxPath $pfx
          } else {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-audit-tools
      - name: Audit source and portable archive before upload
        shell: pwsh
        run: |
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: PySide6_Essentials==6.11.2 -d build/upstream-wheels
          $version = $env:APP_VERSION.TrimStart('v')
          $archive = "release/NetConfigLint-$version-windows-x64-portable.zip"
          $wheel = (Get-ChildItem build/upstream-wheels -Filter 'pyside6_essentials-6.11.2-*.whl' -File | Select-Object -First 1).FullName
          python .release-audit-tools/scripts/audit_release.py --root . --baseline HEAD^ --archive $archive --upstream-wheel $wheel --output build/release-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-portable
          path: release/*.zip

  publish:
    name: Publish GitHub release
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || inputs.source_run_id != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify reusable package run
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq "select(.workflow_id == ${workflow_id} and .status == \"completed\") | .id" | grep -Fx "$SOURCE_RUN_ID"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          jq -e '.jobs | any(.[]; .name == "Package / windows-latest" and .conclusion == "success")' \
            <<< "$jobs" | grep -Fx true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Build checksums
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          cd release
          version="${RELEASE_TAG#v}"
          archive="NetConfigLint-${version}-windows-x64-portable.zip"
          test -f "$archive"
          sha256sum "$archive" > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
