name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package and publish
        required: true
        type: string
      source_run_id:
        description: Completed release run with successful package jobs (reuse artifacts)
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  package:
    name: Package / ${{ matrix.os }}
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      QT_QUICK_CONTROLS_STYLE: Material
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.2"
          cache: pip
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf ccache xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0
      - name: Install WiX MSI toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress
      - name: Install qualified build environment
        run: python -m pip install -c constraints/release.txt -e ".[gui]" Nuitka pefile
      - run: python scripts/check_build_environment.py
      - name: Decode Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/netconfiglint-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          }
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          ./scripts/build_windows.ps1
          $pfx = "$env:RUNNER_TEMP/netconfiglint-signing.pfx"
          if (Test-Path -LiteralPath $pfx) {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild -PfxPath $pfx
            ./scripts/build_msi.ps1 -Version $version -SkipAppBuild -PfxPath $pfx
          } else {
            ./scripts/build_portable.ps1 -Version $version -SkipAppBuild
            ./scripts/build_msi.ps1 -Version $version -SkipAppBuild
          }
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: |
          version="${APP_VERSION#v}"
          python scripts/build_desktop.py
          python scripts/build_linux_deb.py --version "$version"
      - name: Accept Windows MSI installation and both uninstall choices
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:APP_VERSION.TrimStart('v')
          ./scripts/test_windows_msi.ps1 -Version $version
      - name: Import Apple certificates
        if: runner.os == 'macOS' && env.MACOS_APPLICATION_IDENTITY != ''
        env:
          MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATES_P12_BASE64"
          keychain="$RUNNER_TEMP/netconfiglint.keychain-db"
          echo "$MACOS_CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/netconfiglint.p12"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$RUNNER_TEMP/netconfiglint.p12" -P "$MACOS_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Decode Apple notarization key
        if: runner.os == 'macOS' && env.MACOS_NOTARY_KEY_ID != ''
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          test -n "$MACOS_NOTARY_KEY_BASE64"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/netconfiglint-notary.p8"
          echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/netconfiglint-notary.p8" >> "$GITHUB_ENV"
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: |
          version="${APP_VERSION#v}"
          python scripts/build_desktop.py
          python scripts/build_macos_pkg.py --version "$version"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-audit-tools
      - name: Audit source before upload
        run: python .release-audit-tools/scripts/audit_release.py --root . --baseline HEAD^ --output build/release-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.msi
            release/*.deb
            release/*.pkg

  publish:
    name: Publish GitHub release
    needs: package
    if: ${{ always() && (needs.package.result == 'success' || inputs.source_run_id != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify reusable package run
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --jq "select(.workflow_id == ${workflow_id} and .status == \"completed\") | .id" | grep -Fx "$SOURCE_RUN_ID"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          for os in windows-latest ubuntu-latest macos-latest; do
            jq -e --arg name "Package / $os" \
              '.jobs | any(.[]; .name == $name and .conclusion == "success")' <<< "$jobs" | grep -Fx true
          done
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Build checksums
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          cd release
          version="${RELEASE_TAG#v}"
          for extension in zip msi deb pkg; do
            matches=(NetConfigLint-${version}-*.${extension})
            test "${#matches[@]}" -eq 1 && test -f "${matches[0]}"
          done
          find . -maxdepth 1 -type f -name "NetConfigLint-${version}-*" \
            \( -name '*.zip' -o -name '*.msi' -o -name '*.deb' -o -name '*.pkg' \) \
            -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            release/*.zip
            release/*.msi
            release/*.deb
            release/*.pkg
            release/SHA256SUMS.txt
          generate_release_notes: true
