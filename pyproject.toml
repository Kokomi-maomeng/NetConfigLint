[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "netconfiglint"
version = "2.1.0"
description = "A fast, offline, extensible static analyzer for network device configurations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "NetConfigLint contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.9,<6.12"]
dev = [
  "mypy>=1.13",
  "pefile==2024.8.26",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
netconfiglint = "netconfiglint.cli.main:main"
netconfiglint-gui = "netconfiglint.gui.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["netconfiglint"]
artifacts = [
  "netconfiglint/gui/qml/**/*.qml",
  "netconfiglint/gui/i18n/*.json",
  "netconfiglint/vendors/huawei/profiles/*.json",
  "netconfiglint/resources/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["performance: bounded synthetic performance regression checks"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["netconfiglint"]
exclude = ["netconfiglint/gui/qml"]
